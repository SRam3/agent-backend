name: Backend CI

# Runs on every branch and every PR that touches code, tests, the system model
# or this workflow. Docs-only changes are still skipped on purpose — but the
# system model is NOT docs for this purpose: it declares which test guards which
# invariant, so editing it can break the build exactly like editing code.
on:
  push:
    paths:
      - "sales_agent_api/**"
      - "tests/**"
      - "tools/**"
      - "sales-ai-docs/docs/system-model/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "sales_agent_api/**"
      - "tests/**"
      - "tools/**"
      - "sales-ai-docs/docs/system-model/**"
      - ".github/workflows/**"

# A newer push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sales_agent_api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r sales_agent_api/requirements.txt
          pip install -r tools/requirements.txt

      # The WHOLE suite, deliberately. This used to run two files out of eight
      # (test_goal_strategy.py and test_health.py), so a PR could go green while
      # breaking the DAG gates, the operator payment idempotency, the phone gate
      # or the BSUID identity resolution — the tests written in response to real
      # production incidents. The rest only ran after merge, inside the deploy
      # job, which meant a break surfaced on main instead of on the PR.
      #
      # No database is needed: tests/services/ uses stub sessions by convention,
      # and tests/test_health.py sets its own env via monkeypatch. The variables
      # below are what the app reads at import time.
      - name: Run the test suite
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/test
          SALES_AI_SERVICE_TOKEN: ci-test-token
          ENV: dev
        run: pytest tests/ -v --tb=short

      # The system model (sales-ai-docs/docs/system-model/) declares, per
      # component, what must always be true and which test proves it. This step
      # is what stops those declarations from rotting into prose: an invariant
      # cannot claim to hold without a test that exists, a broken one cannot be
      # recorded without pointing at its debt or P front, and renaming a test
      # breaks the build instead of silently orphaning an invariant.
      #
      # It runs AFTER the suite on purpose. If a test fails, that is the news;
      # a model mismatch on top of it is noise.
      - name: Check the system model against the repo
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/test
          SALES_AI_SERVICE_TOKEN: ci-test-token
          ENV: dev
        run: python tools/check_invariants.py --report
