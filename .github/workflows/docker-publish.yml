name: Build, Test and Deploy Backend

# Only what actually changes the image can trigger a deploy.
#
# Without this filter every push to main rebuilt and redeployed `ca-backend`,
# including docs-only merges: a ROADMAP edit restarted the container for no
# reason. Given the cold-start history (2026-06-16 backend, 2026-07-21 n8n), an
# unnecessary deploy is not free.
#
# `tests/**` is deliberately NOT here. A test-only change does not go into the
# image, so it does not deserve a deploy — Backend CI still runs the full suite
# on that push, so a broken test is caught either way.
#
# Use workflow_dispatch to redeploy the current main on demand.
on:
  push:
    branches: [main]
    paths:
      - "sales_agent_api/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

# Never let two deploys race on `az containerapp update`. Queue them instead of
# cancelling: a half-applied deploy is worse than a slow one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sales_agent_api/requirements.txt

      - name: Install dependencies
        run: pip install -r sales_agent_api/requirements.txt

      # Same command and same env as Backend CI, on purpose: the gate that
      # blocks a deploy must not be a different gate from the one that passed
      # on the PR. A failure here stops the job before anything is published.
      - name: Run the test suite
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/test
          SALES_AI_SERVICE_TOKEN: ci-test-token
          ENV: dev
        run: pytest tests/ -v --tb=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./sales_agent_api
          file: ./sales_agent_api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sales-agent-api:latest,${{ secrets.DOCKER_USERNAME }}/sales-agent-api:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Pinned to the commit SHA, never `latest`: the tag names exactly what
      # was built in this run, so a rollback is `az containerapp update` with
      # an older SHA.
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ca-backend \
            --resource-group rg-backend \
            --image docker.io/${{ secrets.DOCKER_USERNAME }}/sales-agent-api:${{ github.sha }}
          echo "Deployed image: ${{ secrets.DOCKER_USERNAME }}/sales-agent-api:${{ github.sha }}"
